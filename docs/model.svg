<rect x="50" y="505" width="400" height="54" rx="14" fill="#274b78"/>
<rect x="50" y="532" width="400" height="27" rx="0" fill="#274b78"/>
<text x="72" y="540" fill="#ffffff" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="700">dim_county</text>
