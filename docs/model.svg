<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
<title id="title">WeatherForge Warehouse P1 dimensional model</title>
<desc id="description">The event snapshot fact has one row per snapshot and source event ID. Snapshot, county, hazard, and event-begin-date dimensions each have a one-to-many relationship to the fact. Reports count one published snapshot at a time.</desc>
<rect x="0" y="0" width="1600" height="1200" rx="0" fill="#f5f8fc"/>
<text x="54" y="62" fill="#162e4b" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700">WeatherForge Warehouse</text>
<text x="54" y="101" fill="#52667d" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400">P1 model · Minnesota 2024 · county rankings by reported-event count</text>
